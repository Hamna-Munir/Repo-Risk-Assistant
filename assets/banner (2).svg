<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#132038"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6FED"/>
      <stop offset="100%" stop-color="#22C9C0"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="100%" stop-color="#3FE0D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F6FED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2F6FED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="1080" cy="90" r="220" fill="url(#glow)"/>

  <!-- compass icon badge -->
  <rect x="80" y="118" width="124" height="124" rx="30" fill="url(#iconGrad)"/>
  <circle cx="142" cy="180" r="38" fill="none" stroke="#0E1420" stroke-width="4" opacity="0.35"/>
  <path d="M142 152 L154 178 L142 208 L130 178 Z" fill="#0E1420" opacity="0.9"/>
  <circle cx="142" cy="180" r="6" fill="#F5F6FA"/>

  <!-- text -->
  <text x="240" y="168" font-family="IBM Plex Sans, Arial, sans-serif" font-size="52" font-weight="700" fill="#F5F6FA">
    Repo Onboarding
  </text>
  <text x="240" y="222" font-family="IBM Plex Sans, Arial, sans-serif" font-size="52" font-weight="700" fill="#F5F6FA">
    &amp; <tspan fill="url(#accentText)">Risk Assistant</tspan>
  </text>

  <text x="242" y="264" font-family="IBM Plex Mono, monospace" font-size="21" fill="#9CA3B5">
    Understand any repo in minutes, not days.
  </text>

  <!-- divider -->
  <line x1="80" y1="296" x2="1180" y2="296" stroke="#2A3348" stroke-width="1"/>

  <text x="80" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" fill="#7C8496">
    Built by Hamna Munir
  </text>
  <text x="1180" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" fill="#7C8496" text-anchor="end">
    IBM Bob 2.0 Hackathon
  </text>
</svg>
